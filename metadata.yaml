name: astrbot_plugin_cosyvoice # 插件唯一识别名，以 astrbot_plugin_ 前缀开头
display_name: CosyVoice3 语音合成 # 用于展示的名字
desc: 接入本地 CosyVoice3 推理服务，让机器人以可配置音色朗读回复（支持 LLM 工具、/tts 指令与关键词触发）。 # 插件简短描述
version: v2.1.26 # 插件版本号
author: Yours # 作者
repo: https://github.com/AstrBotDevs/AstrBot # 插件的仓库地址（请替换为你的仓库）

config:
  - key: base_url
    type: string
    title: 单机服务地址
    description: 未配置「服务端列表」时使用的单一服务地址
    hint: 队列版服务默认端口 50002；原版非队列服务 50000。配置了下方的「服务端列表」后此项仅作全部节点不可用时的回退。
    default: "http://127.0.0.1:50002"
  - key: servers
    type: template_list
    title: 服务端列表
    description: 配置多台 CosyVoice 推理服务，按权重分流；某台故障自动切换其他节点。留空则用上方「单机服务地址」。
    hint: 添加多台服务即可分流（权重越大被选中概率越高）；连续失败的节点会自动临时隔离，其余节点照常服务。「设为默认」勾选的那台会被优先使用（仅限一台）。全部节点不可用时回退到「单机服务地址」。
    templates:
      server:
        name: 添加服务端
        hint: 新增一个 CosyVoice 推理服务地址
        display_item: url
        items:
          url:
            type: string
            title: 服务地址
            description: 推理服务根地址
            hint: 如 http://192.168.1.10:50002、http://192.168.1.11:50000
            default: ""
          enabled:
            type: bool
            title: 启用
            description: 是否参与分流
            hint: 关闭后该节点不参与分流（保留配置，可随时打开）
            default: true
          default:
            type: bool
            title: 设为默认
            description: 是否作为默认（优先）节点
            hint: 勾选后该节点优先使用（有多个勾选时随机取其一）；不勾则按权重分流
            default: false
          weight:
            type: int
            title: 权重
            description: 分流权重，越大被选中概率越高
            hint: 默认 1。例如两台机器一台强一台弱，可设 3:1 让强的多承担请求。
            default: 1
    default: []
  - key: server_voices_dir
    type: string
    title: 服务端参考音频目录
    description: 服务端参考音频目录
    hint: 与服务端启动参数 --voices_dir 一致。填目录名（如 cosyvoice_voices）或绝对路径。配置后 prompt_wav 按文件名由服务端读取、不再上传（推荐大文件用）；留空则按旧逻辑从本端上传
    default: "cosyvoice_voices"
  - key: sample_rate
    type: int
    title: 采样率
    description: 音频采样率(Hz)
    hint: 插件首次合成会向服务端自动获取并覆盖此值，一般不用改；仅当服务端未启动/获取失败时才作为兜底默认值（Fun-CosyVoice3-0.5B-2512 默认 24000）
    default: 24000
  - key: timeout
    type: int
    title: 请求超时（秒）
    description: 单次合成读超时（含服务端排队等待）
    hint: 默认 150。队列版服务端单次推理可能 >30s 且入队最多等 30s，故必须 > 服务端 INFER_TIMEOUT(120)+COSY_QUEUE_WAIT(30)；若压太小会自己先超时断连、制造重试验崩。普通文本 60 也够，但配队列版建议保持 150。
    default: 150
  - key: tts_queue_max_position
    type: int
    title: 排队阈值（繁忙判定）
    description: 服务端返回 X-Queue-Position 且排队位置 ≥ 此值时，判定语音服务器繁忙，直接回退文字
    hint: 默认 8。仅当服务端带 X-Queue-Position 响应头（中转站/队列版服务）时生效；直连 CosyVoice 无此头则完全不受影响、不触发繁忙判定。0=不限制（排队再长也照常等待）。命中繁忙判定时会提前放弃本次合成、回退文字并进入冷却，而不是一直等到超时。同一轮回复仅对第一段做判定（探路），后续分段不再重复判定，避免长回复被误判繁忙或产生半截语音。
    default: 8
  - key: default_voice
    type: string
    title: 默认音色
    description: 默认音色名
    hint: 必须是下方「音色列表」中已配置的一项；留空则使用列表第一个
    default: ""
  - key: voices
    type: template_list
    title: 音色列表
    description: 逐条编辑音色（音色名 + 参考音频 + 参考文本），点击「添加音色」即可新增一条。
    templates:
      voice:
        name: 添加音色
        hint: 新增一条参考音色（含音色名 + 参考音频 + 参考文本）
        display_item: name
        items:
          name:
            type: string
            title: 音色名
            description: 唯一标识
            hint: 用于 /tts_voice 切换与 LLM 工具指定
            default: ""
          prompt_wav:
            type: string
            title: 参考音频
            description: wav 文件名或路径
            hint: 走服务端时只填文件名（配合上面的服务端目录）；走本端上传时填绝对/相对路径
            default: ""
          prompt_text:
            type: string
            title: 参考文本
            description: 音频对应原文（可选）
            hint: 服务端模式且服务端 voices.json 已存该文件名文本时可留空，服务端自动取；仅本端上传模式才需要填
            default: ""
          hidden:
            type: bool
            title: 隐藏
            description: 是否从音色列表中隐藏
            hint: 勾选后该音色不出现在 /tts_voice 列出的音色与 LLM 的 list_voices 中；知道名字仍可手动 /tts_voice 名字 使用
            default: false
          language:
            type: string
            title: 语种
            description: 音色所属语种（多语言分类）
            hint: 如 zh（中文）/ en（英文）/ ja（日文）/ ko（韩文）/ ru（俄文）/ th（泰文）等。留空表示未分类。WebUI 会按语种分组展示。
            default: ""
          markup:
            type: bool
            title: 注入副语言标记
            description: 是否为该音色注入 [breath]/[laughter] 等副语言标记
            hint: 默认开启。若该音色插入换气/笑声后出现音色失真、读法怪异（多见于对标记敏感的参考音频），可单独关掉；关闭后该音色只念纯文本，不受全局「自动标点换气 / 关键词音效」影响。
            default: true
    default: []
  - key: send_mode
    type: string
    title: 发送模式
    description: 语音发送方式
    hint: both=文本+语音都发（推荐，保证聊天记录文字不丢）；voice_only=只发语音（文字仍写入会话上下文）
    options: ["both", "voice_only"]
    default: "both"
  - key: text_after_voice
    type: bool
    title: 先发语音再发文字
    description: 不合并 both 模式下，逐段发送时语音与文字的先后顺序
    hint: true=每段先发语音、再发对应文字（先听后读）；false=先发文字、再发语音（原行为）。仅影响不合并 both（逐段发送）模式；合并 both 文字在结果链一次性发、voice_only 只发语音，这两种不受此控制。
    default: true
  - key: skip_bracket_tts
    type: bool
    title: 括号内容不朗读
    description: 开启后，正文中被括号包裹的文字不进入语音合成
    hint: 支持 中文（）/ 英文() / 方括号[]。both 合并模式：括号内容随文字显示在聊天记录，仅语音不念；voice_only 或不合并 both：括号内容单独作为一条文字消息发给用户。/tts 指令同样剥离括号（不补发文字）。
    default: true
  - key: auto_tts
    type: bool
    title: 自动语音
    description: 是否自动合成
    hint: false=默认不发，仅关键词触发、/tts 或 LLM 工具时才发；true=符合条件的回复自动朗读
    default: false
  - key: translate_display_mode
    type: string
    title: 翻译后文字展示方式
    description: 自动翻译（外语音色）场景下，聊天气泡里显示的文字
    hint: both=优先显示译文，直接换行后 原文：xxx，默认；original=只显示原文；translated=只显示译文。翻译多段时按「换行+句末标点」逐段翻译、文本与语音一同分段。无论哪种，语音都始终念译文。未配置翻译适配器时不生效。
    options: ["both", "original", "translated"]
    default: "both"
  - key: tts_scope
    type: string
    title: 语音范围
    description: 语音覆盖范围
    hint: llm_only=仅转大模型回复；all_text=对所有文本结果（含指令输出）转语音
    options: ["llm_only", "all_text"]
    default: "llm_only"
  - key: enable_llm_tool
    type: bool
    title: 启用 LLM 工具
    description: 注册朗读工具
    hint: 开启后大模型可主动决定朗读某段文本
    default: true
  - key: enable_user_trigger
    type: bool
    title: 启用关键词触发
    description: 关键词触发开关
    hint: 需配合下方「触发关键词」使用
    default: true
  - key: trigger_keywords
    type: list
    title: 触发关键词
    description: 触发语音的词
    items:
      type: string
    hint: 用户消息含这些词即触发本条回复转语音（需 enable_user_trigger=true）。默认：念出来、读出来
    default: ["念出来", "读出来"]
  - key: text_keywords
    type: list
    title: 纯文字请求关键词
    description: 要求用文字回复的词
    items:
      type: string
    hint: 即使已开启 tts_on/自动语音，用户消息含这些词时，本条回复只发文字、不合成语音（不改变语音开关状态）。需 enable_user_trigger=true。默认：用文字、发文字、文字回复、别用语音、这段别念、不用语音念
    default: ["用文字", "发文字", "文字回复", "别用语音", "这段别念", "不用语音念"]
  - key: blocklist
    type: list
    title: 不转语音名单
    description: 跳过语音的名单
    items:
      type: string
    hint: 填 unified_msg_origin 或 sender_id，命中即跳过（优先级高于 allowlist）
    default: []
  - key: allowlist
    type: list
    title: 仅名单内转语音
    description: 仅名单内转语音
    items:
      type: string
    hint: 填 unified_msg_origin 或 sender_id；留空表示不限制
    default: []
  - key: max_text_len
    type: int
    title: 单段硬上限（旧切分/兜底）
    description: 仅在「segment_len 关闭」时作为旧分段逻辑生效；开启 segment_len 后作为「窗口内无标点时的硬切兜底」，不参与分段字数窗口计算
    hint: 默认 200。两种作用：① segment_len=0 时按此值按句切分；② segment_len>0 时仅当某段无标点才用它限制单段最大长度（0=不限制）。与 segment_len 互相独立，不会互相截断。
    default: 200
  - key: segment_len
    type: string
    title: 分段回复字数（最小,最大）
    description: 每段（首段除外）的字数区间，配合分段符号切分，用于长文逐段快速合成
    hint: 格式「最小,最大」(如 30,50)：在 最大 字范围内取最后一个命中的分段符号切分；无标点时按 segment_nopunct 处理(硬切到最大 或 往后找)。最小 同时是短段合并下限——切出的段若短于它(如「哈哈。」)会自动并入相邻段，避免超短句单独成段。只填一个数字(如 50)表示只设最大、不强制合并。0/留空=关闭分段(回退旧逻辑)。与 max_text_len 互相独立。
    default: "0"
  - key: segment_first_len
    type: string
    title: 首段字数（最小,最大）
    description: 首段独立的字数区间（区别于后续每段）
    hint: 格式「最小,最大」(如 15,30)：首段单独按此区间切分(让首段更快出声)，语义同 segment_len。0/留空=首段沿用 segment_len 的区间。首段无标点的处理见 segment_first_nopunct。
    default: "0"
  - key: segment_punct
    type: string
    title: 分段符号
    description: 在分段窗口内命中即切分，按字面值匹配（自动转义，无需写正则）
    hint: 分段只在「完整语义句末符号」处切，避免逗号等切断语义。推荐符号集：「。！？…：；～.!?…:;」（中文句号/感叹/疑问/省略/冒号/分号/语气波 + 英文对应；不含逗号、顿号）。换行分段始终优先。留空等同默认「。！？.!?」。
    default: "。！？.!?"
  - key: segment_first_nopunct
    type: string
    title: 首段无标点规则
    description: 首段字数窗口内没有命中任何分段符号时的处理
    hint: truncate（默认）=直接在窗口末硬切；seek=往后（超出首段窗口）找第一个命中的分段符号切在那里，若到结尾都无标点则整段剩余作为一段。
    default: "truncate"
  - key: segment_nopunct
    type: string
    title: 普通段无标点规则
    description: 首段之外的每段，字数窗口内没有命中任何分段符号时的处理
    hint: truncate（默认）=直接在窗口末硬切；seek=往后（超出本段窗口）找第一个命中的分段符号切在那里，若到结尾都无标点则整段剩余作为一段。
    default: "truncate"
  - key: segment_merge
    type: bool
    title: 分段合并发送
    description: 分段回复是否合并为单条语音发送
    hint: false=不合并：服务端每返回一段语音就立即发一段（流式、多条独立语音消息）；true=合并：全部段生成完后拼接成一个音频再发。默认 false。
    default: false
  - key: tts_context_hint
    type: bool
    title: 语音后回写上下文
    description: 发语音成功后，把本轮内容补回会话上下文，避免 AI 下一轮“不知道自己发了语音/丢了那轮内容”
    hint: 默认 true。开启后：voice_only 模式会把本轮文字补回结果链（否则历史可能为空导致 AI 失忆）；both 模式追加一条“🎙️（以上已用语音播报）”标记让 AI 明确上一轮是语音。关闭则完全不发额外文字。
    default: true
  - key: tts_concurrency
    type: int
    title: TTS 服务端并发上限
    description: 同时打到 CosyVoice 服务端的合成请求数
    hint: 弱服务端（GPU 推理）扛不住多并发：多用户同时触发时会排队而非打爆服务端，避免连接超时雪崩。默认 1=完全串行最稳；服务端够强可调到 2~3 提速。等待期间是协程挂起、不卡 AstrBot 事件循环，其他消息照常。
    default: 1
  - key: tts_max_retry
    type: int
    title: 语音失败重试次数
    description: 服务端返回 429/503/504 等可重试错误或连接中断时的重试次数
    hint: 默认 0=不重试：一次失败直接回退文字并进入冷却，后续请求在冷却期内不再打服务端。若服务端偶发抖动想自动重试可设 1~3；重试会拉长等待（指数退避），不建议过大。
    default: 0
  - key: tts_retry_backoff
    type: float
    title: 重试退避基数（秒）
    description: 每次重试前的等待 = 基数 × 2^第几次重试
    hint: 默认 0.5。仅 tts_max_retry>0 时生效；实际等待为 0.5s、1s、2s…。不想让重试拖太久就调小。
    default: 0.5
  - key: tts_cooldown_sec
    type: float
    title: 语音失败冷却时长（秒）
    description: 服务端失联/失败后，多久内不再向服务端发任何请求、直接回退文字
    hint: 默认 30。一次语音失败（含重试耗尽）即进入冷却：冷却期内本插件完全不打 TTS 服务端、直接发文字（voice_only 也回退文字），避免一直卡着连文字也不发。冷却到期后再试一次，成功则恢复。调大可避免在服务端恢复前反复失败。
    default: 30
  - key: split_by_newline
    type: bool
    title: 优先按换行分段
    description: QQ 等多行消息：遇到换行先按行切分，再各自合成
    hint: 默认 true。开启后：一个或连续多个换行 \n 都视为硬分段边界，逐行 strip 去空，每行独立分段/合成，不跨行合并（多行语义通常独立）。避免把换行符念成噪音/静音，也避免超长行一次合成。关闭则整段按标点窗口分段（旧行为）。
    default: true
  - key: auto_breath
    type: bool
    title: 自动标点换气
    description: 自动标点换气：句末插 [breath]、句中插 [quick_breath]，让语音更自然
    hint: 句末自动插入换气标记，让语音更自然；默认开启，低风险。
    default: true
  - key: auto_effect
    type: bool
    title: 关键词音效
    description: 关键词音效：笑/叹气/咳嗽等按语种词典在句末追加 [laughter]/[sigh]/[cough]
    hint: 开启后按语种词典在句末追加情绪音效；默认关闭，需手动开启。
    default: false
  - key: effect_intensity
    type: string
    title: 关键词音效密度
    description: 关键词音效密度：light（每句≤1）/ medium（≤3）/ strong（≤5）。仅 auto_effect=true 时生效。
    hint: 仅 auto_effect=true 时生效；light/medium/strong 控制每轮追加音效上限。
    default: "medium"
